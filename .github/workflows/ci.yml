# Só testes e build. O serviço NÃO roda no GitHub Actions (ver ADR 0001).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ceu/sky-engine test
      - run: pnpm --filter @ceu/sky-engine typecheck
      - run: pnpm --filter @ceu/worker test
      - run: pnpm --filter @ceu/worker typecheck
      - run: pnpm --filter @ceu/web build
